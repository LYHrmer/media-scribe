<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f0" />
    <meta name="description" content="文本统计：字数、词数、行数、段落、字节与预计阅读时长，输入即统计。浏览器本地处理。" />
    <title>文本统计 · 听写匣工具箱</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="返回工具箱首页">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 10v4M9 6v12M13 3v18M17 7v10M21 10v4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
          <span>听写匣<span class="brand-edition">工具箱</span></span>
        </a>
        <span class="local-badge"><span class="status-dot" aria-hidden="true"></span>本地处理，数据不上传</span>
      </header>

      <main>
        <noscript><p class="inline-error">此工具需要启用 JavaScript 才能运行。</p></noscript>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">浏览器本地 <span>·</span> 粘贴或拖入文件</p>
          <h1 id="page-title">文本 <span>统计。</span></h1>
          <p class="intro-description">字数、词数、行数、段落与预计阅读时长，输入即统计。</p>
        </section>

        <section class="panel tool-panel">
          <div class="tool-section">
            <div class="tool-file-row">
              <label class="tool-label" for="stats-text">文本内容（粘贴或选择文本文件）</label>
              <button id="stats-file-button" class="text-button" type="button">选择文件</button>
              <input id="stats-file-input" type="file" accept=".txt,.md,.srt,.vtt,.json,.csv,.log" hidden />
            </div>
            <textarea id="stats-text" class="tool-textarea" spellcheck="false" placeholder="在这里粘贴或输入文本…"></textarea>
          </div>

          <div id="tool-error" class="inline-error" role="alert" hidden></div>

          <div class="stats-grid">
            <div class="stat-card"><div id="stat-words" class="stat-value">0</div><div class="stat-name">词数（中文每字一词）</div></div>
            <div class="stat-card"><div id="stat-chars" class="stat-value">0</div><div class="stat-name">字符</div></div>
            <div class="stat-card"><div id="stat-bytes" class="stat-value">0</div><div class="stat-name">字节（UTF-8）</div></div>
            <div class="stat-card"><div id="stat-lines" class="stat-value">0</div><div class="stat-name">行</div></div>
            <div class="stat-card"><div id="stat-paragraphs" class="stat-value">0</div><div class="stat-name">段落</div></div>
            <div class="stat-card"><div id="stat-reading" class="stat-value">少于 1 分钟</div><div class="stat-name">预计阅读（400 词/分）</div></div>
          </div>
          <p id="stat-breakdown" class="tool-hint">含中文 0 字、英文 0 词</p>
        </section>
      </main>

      <footer class="site-footer"><span>听写匣工具箱</span><span>本地处理 <span class="footer-dot">·</span> 数据不上传</span></footer>
    </div>
    <script type="module" src="/src/tools/text-stats.js"></script>
  </body>
</html>
