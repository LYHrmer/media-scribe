<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f0" />
    <meta name="description" content="文件哈希：拖入文件，本地计算 SHA-256 / SHA-1 / SHA-512，可粘贴期望哈希自动比对。浏览器本地处理。" />
    <title>文件哈希 · 听写匣工具箱</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="返回工具箱首页">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 10v4M9 6v12M13 3v18M17 7v10M21 10v4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
          <span>听写匣<span class="brand-edition">工具箱</span></span>
        </a>
        <span class="local-badge"><span class="status-dot" aria-hidden="true"></span>本地处理，数据不上传</span>
      </header>

      <main>
        <noscript><p class="inline-error">此工具需要启用 JavaScript 才能运行。</p></noscript>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">浏览器本地 <span>·</span> 文件不出设备</p>
          <h1 id="page-title">文件 <span>哈希。</span></h1>
          <p class="intro-description">拖入文件计算 SHA-256 / SHA-1 / SHA-512，粘贴期望哈希即可自动比对。</p>
        </section>

        <section class="panel tool-panel">
          <div class="tool-section">
            <div id="hash-drop" class="hash-drop" role="button" tabindex="0">把文件拖到这里，或点击选择文件</div>
            <input id="hash-file-input" type="file" hidden />
            <p id="file-info" class="tool-hint" hidden></p>
            <p class="tool-hint">文件只在浏览器内存里读取，不会上传；单个文件上限 500 MB。</p>
          </div>

          <div class="tool-section">
            <label class="tool-label" for="hash-expected">期望哈希（可选，粘贴后自动与每行比对）</label>
            <input id="hash-expected" class="tool-input regex-pattern" type="text" spellcheck="false" placeholder="粘贴发布页给出的 SHA-256 / SHA-1 / SHA-512…" />
          </div>

          <div id="tool-error" class="inline-error" role="alert" hidden></div>
          <p id="hash-status" class="tool-status" role="status" hidden></p>

          <div class="tool-section" id="result-section" hidden>
            <div class="hash-row">
              <span class="hash-algo">SHA-256</span>
              <input id="hash-sha256" class="hash-value" type="text" readonly />
              <button class="text-button copy-button" type="button" data-target="hash-sha256">复制</button>
              <span id="cmp-sha256" class="hash-cmp"></span>
            </div>
            <div class="hash-row">
              <span class="hash-algo">SHA-1</span>
              <input id="hash-sha1" class="hash-value" type="text" readonly />
              <button class="text-button copy-button" type="button" data-target="hash-sha1">复制</button>
              <span id="cmp-sha1" class="hash-cmp"></span>
            </div>
            <div class="hash-row">
              <span class="hash-algo">SHA-512</span>
              <input id="hash-sha512" class="hash-value" type="text" readonly />
              <button class="text-button copy-button" type="button" data-target="hash-sha512">复制</button>
              <span id="cmp-sha512" class="hash-cmp"></span>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer"><span>听写匣工具箱</span><span>本地处理 <span class="footer-dot">·</span> 数据不上传</span></footer>
    </div>
    <script type="module" src="/src/tools/file-hash.js"></script>
  </body>
</html>
