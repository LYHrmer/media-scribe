<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f0" />
    <meta name="description" content="文本对比：两段文本逐行对比，标出新增与删除。浏览器本地处理，不上传内容。" />
    <title>文本对比 · 听写匣工具箱</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="返回工具箱首页">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 10v4M9 6v12M13 3v18M17 7v10M21 10v4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
          <span>听写匣<span class="brand-edition">工具箱</span></span>
        </a>
        <span class="local-badge"><span class="status-dot" aria-hidden="true"></span>本地处理，数据不上传</span>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">浏览器本地 <span>·</span> 粘贴或拖入文件</p>
          <h1 id="page-title">文本<span>对比。</span></h1>
          <p class="intro-description">两段文本逐行对比，标出新增与删除，适合改稿、改配置。</p>
        </section>

        <section class="panel tool-panel">
          <div class="diff-inputs">
            <div class="tool-section">
              <div class="tool-file-row">
                <label class="tool-label" for="diff-a">原文</label>
                <button id="diff-a-file-button" class="text-button" type="button">选择文件</button>
                <input id="diff-a-file-input" type="file" accept=".txt,.md,.srt,.vtt,.json,.csv,.log" hidden />
              </div>
              <textarea id="diff-a" class="tool-textarea" spellcheck="false" placeholder="旧版本…"></textarea>
            </div>
            <div class="tool-section">
              <div class="tool-file-row">
                <label class="tool-label" for="diff-b">新文本</label>
                <button id="diff-b-file-button" class="text-button" type="button">选择文件</button>
                <input id="diff-b-file-input" type="file" accept=".txt,.md,.srt,.vtt,.json,.csv,.log" hidden />
              </div>
              <textarea id="diff-b" class="tool-textarea" spellcheck="false" placeholder="新版本…"></textarea>
            </div>
          </div>

          <div class="tool-row">
            <button id="run-button" class="primary-button" type="button">开始对比</button>
            <button id="swap-button" class="secondary-button" type="button">交换 A/B</button>
            <span id="diff-stats" class="diff-stats" role="status"></span>
          </div>
          <div id="tool-error" class="inline-error" role="alert" hidden></div>
          <p id="coarse-hint" class="tool-hint" hidden>变化区域过大，已按整段显示删除与新增。</p>
          <div id="diff-view" class="diff-view" hidden></div>
          <p class="tool-hint">提示：按行对比；合计超过 20 万字符的文本请分段对比。</p>
        </section>
      </main>

      <footer class="site-footer"><span>听写匣工具箱</span><span>本地处理 <span class="footer-dot">·</span> 数据不上传</span></footer>
    </div>
    <script type="module" src="/src/tools/text-diff.js"></script>
  </body>
</html>
