name: Deploy browser transcription to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job receives only the permissions it needs.
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip
      - name: Run tests
        run: npm test
      - name: Build static site and model assets
        # configure-pages returns /repo for project sites and an empty path
        # for owner.github.io sites or a custom domain. Both need a trailing /.
        env:
          APP_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          STATIC_HOST_LIMIT_MIB: 1024
        run: npm run build
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
